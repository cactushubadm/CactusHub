; Cactus Eventos White Label — perfil recomendado para HostGator/cPanel
; O servidor pode impor limites menores/maiores conforme o plano.
display_errors = Off
log_errors = On
expose_php = Off
date.timezone = America/Sao_Paulo
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 16M
post_max_size = 20M
session.cookie_httponly = 1
session.cookie_samesite = Lax
