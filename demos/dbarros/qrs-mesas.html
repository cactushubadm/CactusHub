<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D'barros | QR Codes das Mesas</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1ede8;color:#171311;font-family:Arial,sans-serif}.head{width:min(1100px,calc(100% - 28px));margin:24px auto 14px;display:flex;align-items:end;justify-content:space-between;gap:16px}.head small{display:block;color:#d86d22;font-size:9px;font-weight:900;letter-spacing:.1em}.head h1{margin:5px 0 0;font-size:32px}.head p{margin:5px 0 0;color:#756b64;font-size:11px}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:10px;padding:10px 13px;font-size:9px;font-weight:900}.print{background:#171311;color:#fff}.refresh{background:#fff;border:1px solid #ddd5cf!important}.info{width:min(1100px,calc(100% - 28px));margin:0 auto 14px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid #e0d8d1;font-size:10px;color:#655b55}.grid{width:min(1100px,calc(100% - 28px));margin:0 auto 40px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{page-break-inside:avoid;background:#fff;border:1px solid #ddd5cf;border-radius:17px;padding:18px;text-align:center}.card small{font-size:8px;letter-spacing:.1em;color:#d86d22;font-weight:900}.card h2{font-size:29px;margin:7px 0 10px}.card img{width:180px;height:180px;margin:0 auto 9px}.card strong{display:block;font-size:14px}.card p{font-size:9px;color:#776d65;line-height:1.45}.url{font-size:7px!important;word-break:break-all;color:#9b918a!important}@media(max-width:760px){.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.actions{width:100%}.actions button{flex:1}}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media print{body{background:#fff}.head,.info{display:none}.grid{width:100%;margin:0;grid-template-columns:repeat(2,1fr);gap:8mm}.card{border:1px solid #aaa;border-radius:0;padding:7mm}}
</style></head><body><header class="head"><div><small>GESTÃO DO SALÃO</small><h1>QR Codes das Mesas</h1><p>Gerados automaticamente conforme a quantidade de mesas cadastradas.</p></div><div class="actions"><button class="refresh" onclick="location.reload()">Atualizar</button><button class="print" onclick="print()">Imprimir QR Codes</button></div></header><div class="info" id="info"></div><main class="grid" id="grid"></main><script>
const TABLES_KEY='dbarros_tables_v1';
function count(){try{const x=JSON.parse(localStorage.getItem(TABLES_KEY));if(x&&Number(x.count)>=1)return Math.min(99,Number(x.count))}catch(e){}return 10}
function tableUrl(n){const u=new URL('demo-salao.html',location.href);u.searchParams.set('mesa',String(n).padStart(2,'0'));return u.href}
function qr(u){return 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=12&data='+encodeURIComponent(u)}
const c=count();document.getElementById('info').innerHTML=`<strong>${c} mesa${c===1?'':'s'} cadastrada${c===1?'':'s'}.</strong> A lista acompanha o Painel do Gestor.`;document.getElementById('grid').innerHTML=Array.from({length:c},(_,i)=>{const n=i+1,u=tableUrl(n);return `<article class="card"><small>D'BARROS PIZZAS</small><h2>Mesa ${String(n).padStart(2,'0')}</h2><img src="${qr(u)}" alt="QR Code Mesa ${n}"><strong>Escaneie para pedir</strong><p>O pedido abre identificado nesta mesa.</p><p class="url">${u}</p></article>`}).join('');
</script></body></html>
