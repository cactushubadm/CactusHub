<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E1524">
<title>Status da assinatura — Cactus Hub</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
<div class="container nav-wrap">
<a aria-label="Cactus Hub" class="brand" href="index.html">
<img alt="Cactus Hub" class="brand-mark-img" src="assets/logo-primary.png">
<span class="brand-copy"><strong>CACTUS HUB</strong><small>SOLUÇÕES TECNOLÓGICAS</small></span>
</a>
</div>
</header>
<main>
<section class="section-dark sales-product-hero"><div class="container compact-hero-grid"><div class="compact-hero-copy">
<span class="eyebrow">Status da assinatura</span><h1 id="title">Consultando seu pedido...</h1><p id="message">A confirmação final é feita pela API do Mercado Pago, não pelo retorno do navegador.</p>
</div></div></section>
<section class="section"><div class="container" style="max-width:820px">
<div id="detail" class="contact-form"></div>
<p><a class="btn btn-outline-dark" href="produtos.html">Voltar aos produtos</a></p>
</div></section>
</main>
<script>
(async()=>{
 const p=new URLSearchParams(location.search);
 const order=p.get('order'), token=p.get('token');
 const returnedSubscription=p.get('preapproval_id')||p.get('subscription_id')||p.get('subscription');
 const storedStatus=sessionStorage.getItem('cactusCommerceStatusUrl')||'';
 const storedSubscription=sessionStorage.getItem('cactusCommerceSubscriptionId')||'';
 const subscription=returnedSubscription||storedSubscription;
 const title=document.querySelector('#title'), msg=document.querySelector('#message'), detail=document.querySelector('#detail');

 const candidates=[];
 if(order&&token)candidates.push('/api/commerce/orders/'+encodeURIComponent(order)+'?token='+encodeURIComponent(token));
 if(storedStatus&&!candidates.includes(storedStatus))candidates.push(storedStatus);
 if(subscription)candidates.push('/api/commerce/subscriptions/'+encodeURIComponent(subscription));

 if(!candidates.length){
   title.textContent='Pedido não identificado';
   msg.textContent='Não foi possível recuperar automaticamente o identificador da assinatura.';
   return;
 }

 let activeIndex=0;
 async function fetchStatus(){
   let lastError=null;
   for(let i=activeIndex;i<candidates.length;i++){
     try{
       const r=await fetch(candidates[i],{headers:{Accept:'application/json'},cache:'no-store'});
       const b=await r.json();
       if(!r.ok)throw new Error(b?.error?.message||'Não foi possível consultar o pedido.');
       activeIndex=i;
       return b;
     }catch(err){lastError=err;}
   }
   throw lastError||new Error('Não foi possível consultar o pedido.');
 }

 async function poll(){
  try{
   const b=await fetchStatus(), status=b.status;
   const names={agrohub:'Cactus One Agro',buildhub:'Cactus One Build',minehub:'Cactus One Miner',logihub:'Cactus One Route'};
   const productName=names[b.product]||'Cactus One';
   if(status==='ONLINE'){
    title.textContent='Seu '+productName+' está pronto';
    msg.textContent='Primeira cobrança confirmada e ambiente criado.';
    detail.innerHTML='<h3>Primeiro acesso</h3><p>Use o botão abaixo para definir o administrador e a senha.</p><p><a class="btn btn-primary" href="'+b.firstAccessUrl.replace(/"/g,'&quot;')+'">Acessar meu '+productName+'</a></p>';
    sessionStorage.removeItem('cactusCommerceStatusUrl');
    sessionStorage.removeItem('cactusCommerceSubscriptionId');
    sessionStorage.removeItem('cactusCommerceOrderId');
    return;
   }
   if(status==='AWAITING_PAYMENT'){title.textContent='Confirmando sua assinatura';msg.textContent='O pagamento já foi enviado ao Mercado Pago. Estamos conciliando a primeira cobrança com a Factory.';}
   else if(status==='PAYMENT_CONFIRMED_SETUP_PENDING'){title.textContent='Pagamento confirmado';msg.textContent='Sua assinatura '+productName+' está ativa. A equipe Cactus Hub está preparando a ativação do ambiente.';}
   else if(status==='PAYMENT_REVIEW_REQUIRED'){title.textContent='Assinatura/pagamento em revisão';msg.textContent='O pedido precisa de conferência antes de continuar.';}
   else if(status==='FAILED'||status==='VALIDATION_FAILED'){title.textContent='Não foi possível concluir automaticamente';msg.textContent='Seu pedido foi preservado para análise da equipe Cactus Hub.';}
   else {title.textContent='Configurando seu '+productName;msg.textContent='Assinatura confirmada. A Factory está preparando seu ambiente: '+status+'.';}
   detail.textContent='Pedido: '+b.orderId+' • Status: '+status+(b.subscriptionStatus?' • Assinatura: '+b.subscriptionStatus:'');
   setTimeout(poll,5000);
  }catch(err){
    title.textContent='Consultando seu pedido';
    msg.textContent=err.message;
    setTimeout(poll,10000);
  }
 }
 poll();
})();
</script>
</body>
</html>
